services:
  - type: web
    # Dashboard service name. The currently verified URL is
    # https://my-ai-agent-acqy.onrender.com (see README.md). If this Blueprint
    # creates a new service, update the vercel.json rewrite to its URL.
    name: myai-agent-malvic-backend
    # Docker pins Node 22 and Python 3.12+ in the repository Dockerfile.
    runtime: docker
    plan: starter
    region: ohio
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: "npm run start --workspace=server"
    healthCheckPath: /api/health
    disk:
      name: myai-agent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/app.db
      - key: WORKSPACE_ROOT
        value: /var/data/workspaces
      - key: AI_PROVIDER
        value: openai
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      # Retained for compatibility; the actual Node binary is pinned in the Dockerfile.
      - key: NODE_VERSION
        value: "22"
      # Admin provisioning: before the first deploy, set BOOTSTRAP_TOKEN to a
      # long random string in the Render dashboard. Ordinary users sign up and
      # use Google sign-in without it. The owner calls
      # POST /api/auth/admin/provision with this token to create or promote the
      # first administrator; the endpoint stops working once one admin exists.
      # Afterwards set ALLOW_REGISTRATION to "false" (existing accounts can
      # always log in). sync:false keeps the real value out of the repo.
      - key: BOOTSTRAP_TOKEN
        sync: false
      - key: AUTH_SESSION_DAYS
        value: "30"
      - key: ALLOW_REGISTRATION
        # Governs ordinary public registration. Leave "true" so Google and
        # password sign-up work normally; set "false" once the administrator is
        # provisioned. Login for existing accounts is unaffected.
        value: "true"
